[package]
name = "remin"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
# Using the Git because it contains a patch for Wayland.
# TODO: switch back to crates.io once 0.6.2 comes out
enigo = { git = "https://github.com/enigo-rs/enigo.git", features = ["wayland"] }
log = "0.4.33"
wincode = { version = "0.5.5", features = ["derive"] }
# wpgu version must be synchronised with slint unstable-wgpu-* feature and gpu-video's wgpu version
wgpu = "29.0.0"
tokio = { version = "1.52.4", default-features = false, features = ["macros", "rt", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing = { version = "0.1.44", features = ["log-always"] }
chrono = "0.4.45"
clap = { version = "4.6.4", features = ["derive"] }
winit = "0.30.13"
# Using the Git because the latest crates.io version relies on outdated CMake.
opus = { git = "https://github.com/SpaceManiac/opus-rs.git" }
rtrb = "0.3.4"
egui = "0.35.0"
egui-wgpu = "0.35.0" # using 0.35 instead of 0.36 because gpu-video requires wgpu 0.29
egui-winit = { version = "0.35.0", default-features = false, features = ["wayland", "x11"] }

# TODO: use git paths once janck and netnet are stable
janck = { path = "./janck" }
netnet = { path = "./netnet" }
avec = { path = "./avec" }
fps_ticker = { path = "./fps_ticker" }
adieu = { path = "./adieu" }

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { path = "../cpal", features = ["pipewire", "realtime-dbus"] }

[target.'cfg(target_os = "windows")'.dependencies]
cpal = { path = "../cpal", features = ["asio"] }

# always use release profile for janck
# settings from https://doc.rust-lang.org/cargo/reference/profiles.html#release
[profile.dev.package.janck]
opt-level = 3
strip = "none"
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 16

[patch.crates-io]
# patch that makes vk-mem (dependency of gpu-video) statically link libstdc++ on Windows
vk-mem = { version = "0.4.0", path = "./vk-mem-rs" }
